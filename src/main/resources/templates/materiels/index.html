<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matériels - Gestion Inventaire</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Sidebar universelle -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Content -->
<div class="content flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-box"></i> Matériels</h2>
        <a th:href="@{/materiels/add}" class="btn btn-primary" sec:authorize="hasRole('GESTIONNAIRE')">
            <i class="fa-solid fa-plus"></i> Ajouter matériel
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Liste des Matériels</div>
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Total</th>
                    <th>Disponibles</th>
                    <th>Date d'acquisition</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="materiel, iterStat : ${materiels}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${materiel.nom}">Laptop Dell</td>
                    <td th:text="${materiel.categorie.nom}">Informatique</td>
                    <td th:text="${materiel.quantite}">15</td>

                    <!-- Disponibles = quantite - nombre de prêts en cours -->
                    <td th:text="${materiel.quantite - #lists.size(materiel.prets.?[statut=='EN_COURS'])}">10</td>

                    <td th:text="${#dates.format(materiel.dateAcquisition,'dd/MM/yyyy')}">25/08/2025</td>
                    <td>
                        <!-- UTILISATEUR : Demander un prêt si disponible -->
                        <a th:if="${materiel.quantite - #lists.size(materiel.prets.?[statut=='EN_COURS']) > 0}"
                           th:href="@{/prets/add(materielId=${materiel.idMateriel})}"
                           class="btn btn-sm btn-outline-success"
                           sec:authorize="hasRole('UTILISATEUR')">
                            <i class="fa-solid fa-hand-holding"></i> Demander prêt
                        </a>

                        <!-- GESTIONNAIRE : Voir / Modifier / Supprimer -->
                        <a th:href="@{/materiels/voir/{id}(id=${materiel.idMateriel})}"
                           class="btn btn-sm btn-outline-primary"
                           sec:authorize="hasRole('GESTIONNAIRE')">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a th:href="@{/materiels/edit/{id}(id=${materiel.idMateriel})}"
                           class="btn btn-sm btn-outline-warning"
                           sec:authorize="hasRole('GESTIONNAIRE')">
                            <i class="fa-solid fa-pen"></i>
                        </a>
                        <form th:action="@{/materiels/delete/{id}(id=${materiel.idMateriel})}"
                              method="post" style="display:inline;"
                              sec:authorize="hasRole('GESTIONNAIRE')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce matériel ?');">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>

                        <!-- ADMIN : aucun bouton -->
                        <span sec:authorize="hasRole('ADMIN')">Aucune action</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
