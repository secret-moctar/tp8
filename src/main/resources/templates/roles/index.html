<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rôles - Gestion Inventaire</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar universelle -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Contenu principal -->
<div class="content flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-user-shield"></i> Rôles</h2>
        <a th:href="@{/roles/add}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="fa-solid fa-plus"></i> Ajouter un rôle
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Liste des Rôles</div>
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nom du rôle</th>
                    <th>Description</th>
                    <th sec:authorize="hasRole('ADMIN')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="role, iterStat : ${roles}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${role.nom}">ADMIN</td>
                    <td th:text="${role.description}">Administrateur du système</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/roles/edit/{id}(id=${role.idRole})}"
                           class="btn btn-sm btn-outline-warning">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <form th:action="@{/roles/delete/{id}(id=${role.idRole})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce rôle ?');">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
