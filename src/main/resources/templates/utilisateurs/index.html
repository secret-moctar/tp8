<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs - Gestion Inventaire</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar universelle -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Content -->
<div class="content flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-users"></i> Utilisateurs</h2>
        <a th:href="@{/utilisateurs/add}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="fa-solid fa-plus"></i> Ajouter utilisateur
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Liste des Utilisateurs</div>
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th sec:authorize="hasRole('ADMIN')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user, iterStat : ${utilisateurs}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${user.nom}">Jean Dupont</td>
                    <td th:text="${user.email}">jean.dupont@email.com</td>
                    <td th:text="${user.role.nom}">ADMIN</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <!-- Voir -->
                        <a th:href="@{/utilisateurs/voir/{id}(id=${user.idUtilisateur})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-eye"></i>
                        </a>

                        <!-- Modifier -->
                        <a th:href="@{/utilisateurs/edit/{id}(id=${user.idUtilisateur})}"
                           class="btn btn-sm btn-outline-warning">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <!-- Supprimer -->
                        <form th:action="@{/utilisateurs/delete/{id}(id=${user.idUtilisateur})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?');">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
