<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Inventaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('../images/login-background.png') no-repeat center center fixed;
            background-size: cover;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5); /* dark overlay for contrast */
        }
        .login-card {
            position: relative;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            z-index: 10;
            animation: fadeInUp 0.8s ease;
        }
        .login-card h3 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
            text-align: center;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
        }
        .btn-login {
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            border: none;
            color: white;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .login-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #fff;
        }
        .login-footer a {
            color: #f0f0f0;
            text-decoration: underline;
            font-weight: 500;
        }
        @keyframes fadeInUp {
            from {opacity: 0; transform: translateY(30px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="login-card">
    <div class="text-center mb-4">
        <i class="fa-solid fa-boxes-stacked fa-3x text-primary"></i>
    </div>
    <h3>Connexion</h3>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Adresse Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="username" class="form-control" placeholder="exemple@mail.com" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de Passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-login">Se Connecter</button>
    </form>
    <div class="login-footer">
        <p>Mot de passe oublié ? <a href="#">Réinitialiser</a></p>
        <p>Pas de compte ? <a href="#">Créer un compte</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
