<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des Activités</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">📜 Historique des Activités</h2>

    <!-- Tableau des activités -->
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Utilisateur</th>
            <th scope="col">Action</th>
            <th scope="col">Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activite : ${activites}">
            <td th:text="${activite.idActivite}"></td>
            <td th:text="${activite.utilisateur != null ? activite.utilisateur.nom : 'Système'}"></td>
            <td th:text="${activite.action}"></td>
            <td th:text="${#temporals.format(activite.dateAction, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Bouton retour -->
    <a href="/dashboard" class="btn btn-secondary">⬅ Retour au Dashboard</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
