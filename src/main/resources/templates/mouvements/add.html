<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Mouvement</title>

    <!-- Bootstrap + FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Contenu -->
<div class="content flex-grow-1 p-4">

    <h2 class="mb-4"><i class="fa fa-plus"></i> Ajouter un Mouvement</h2>

    <form th:action="@{/mouvements/save}" th:object="${mouvement}" method="post" class="card p-4 shadow-sm">

        <!-- Matériel -->
        <div class="mb-3">
            <label class="form-label">Matériel</label>
            <select class="form-select" th:field="*{materiel}" required>
                <option value="">-- Choisir --</option>
                <option th:each="m : ${materiels}" th:value="${m}" th:text="${m.nom}"></option>
            </select>
        </div>

        <!-- Type -->
        <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" th:field="*{type}" required>
                <option value="">-- Choisir --</option>
                <option value="ENTREE">Entrée</option>
                <option value="SORTIE">Sortie</option>
            </select>
        </div>

        <!-- Quantité -->
        <div class="mb-3">
            <label class="form-label">Quantité</label>
            <input type="number" min="1" class="form-control" th:field="*{quantite}" required>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-between">
            <a th:href="@{/mouvements}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Retour</a>
            <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Enregistrer</button>
        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
