<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouvements - Gestion Inventaire</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar universelle -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Content -->
<div class="content flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-right-left"></i> Mouvements</h2>
        <a th:href="@{/mouvements/add}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">
            <i class="fa-solid fa-plus"></i> Ajouter mouvement
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Liste des Mouvements</div>
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Type</th>
                    <th>Matériel</th>
                    <th>Quantité</th>
                    <th>Date</th>
                    <th>Utilisateur</th>
                    <th sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="mouvement, iterStat : ${mouvements}">
                    <td th:text="${iterStat.count}">1</td>
                    <td>
                        <span th:classappend="${mouvement.type == 'ENTREE'} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${mouvement.type}">ENTREE</span>
                    </td>
                    <td th:text="${mouvement.materiel.nom}">Ordinateur</td>
                    <td th:text="${mouvement.quantite}">5</td>
                    <td th:text="${#dates.format(mouvement.dateMouvement,'dd/MM/yyyy')}">25/08/2025</td>
                    <td th:text="${mouvement.utilisateur.nom}">Admin</td>
                    <td sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">
                        <!-- Voir -->
                        <a th:href="@{/mouvements/voir/{id}(id=${mouvement.idMouvement})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-eye"></i>
                        </a>

                        <!-- Modifier -->
                        <a th:href="@{/mouvements/edit/{id}(id=${mouvement.idMouvement})}"
                           class="btn btn-sm btn-outline-warning" sec:authorize="hasRole('ADMIN')">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <!-- Supprimer -->
                        <form th:action="@{/mouvements/delete/{id}(id=${mouvement.idMouvement})}"
                              method="post" style="display:inline;" sec:authorize="hasRole('ADMIN')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce mouvement ?');">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
