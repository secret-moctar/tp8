<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prêts - Gestion Inventaire</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar universelle -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Contenu principal -->
<div class="content flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-hand-holding"></i> Liste des Prêts</h2>

        <!-- Bouton Ajouter visible seulement pour admin ou gestionnaire -->
        <a th:href="@{/prets/add}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">
            <i class="fa-solid fa-plus"></i> Ajouter un prêt
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">Liste des prêts enregistrés</div>

        <div class="card-body table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Matériel</th>
                    <th>Utilisateur</th>
                    <th>Date Début</th>
                    <th>Date Fin</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="pret, iterStat : ${prets}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${pret.materiel.nom}">Laptop</td>
                    <td th:text="${pret.utilisateur.nom}">John Doe</td>
                    <td th:text="${#dates.format(pret.dateDebut,'dd/MM/yyyy')}">01/09/2025</td>
                    <td th:text="${#dates.format(pret.dateFin,'dd/MM/yyyy')}">05/09/2025</td>

                    <td>
                        <span class="badge"
                              th:classappend="${pret.statut == 'En cours'} ? 'bg-info' :
                                              (pret.statut == 'Terminé' ? 'bg-success' : 'bg-warning')"
                              th:text="${pret.statut}">
                            En cours
                        </span>
                    </td>

                    <td>
                        <!-- Bouton Voir (pour tout le monde) -->
                        <a th:href="@{/prets/voir/{id}(id=${pret.idPret})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-eye"></i>
                        </a>

                        <!-- Boutons réservés à l'admin et gestionnaire -->
                        <span sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">
                            <a th:href="@{/prets/edit/{id}(id=${pret.idPret})}"
                               class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-pen"></i>
                            </a>

                            <form th:action="@{/prets/delete/{id}(id=${pret.idPret})}" method="post"
                                  style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce prêt ?');">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </span>

                        <!-- Bouton Retour visible si prêt en cours -->
                        <span th:if="${pret.statut == 'En cours'}"
                              sec:authorize="hasAnyRole('ADMIN','GESTIONNAIRE')">
                            <form th:action="@{/prets/{id}/retour(id=${pret.idPret})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="fa-solid fa-rotate-left"></i> Retour
                                </button>
                            </form>
                        </span>
                    </td>
                </tr>

                <!-- Si aucun prêt -->
                <tr th:if="${#lists.isEmpty(prets)}">
                    <td colspan="7" class="text-muted">Aucun prêt trouvé.</td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
