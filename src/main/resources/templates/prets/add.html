<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Prêt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content flex-grow-1 p-4">
    <h2><i class="fa-solid fa-plus"></i> Ajouter Prêt</h2>

    <form th:action="@{/prets/add}" th:object="${pret}" method="post">
        <div class="mb-3">
            <label class="form-label">Matériel</label>
            <select class="form-select" th:field="*{materiel.id}">
                <option th:each="materiel : ${materiels}" th:value="${materiel.id}" th:text="${materiel.nom}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Utilisateur</label>
            <select class="form-select" th:field="*{utilisateur.id}">
                <option th:each="user : ${utilisateurs}" th:value="${user.id}" th:text="${user.nom}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date Début</label>
            <input type="date" class="form-control" th:field="*{dateDebut}">
        </div>

        <div class="mb-3">
            <label class="form-label">Date Fin</label>
            <input type="date" class="form-control" th:field="*{dateFin}">
        </div>

        <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"></i> Enregistrer</button>
        <a th:href="@{/prets}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Retour</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
