<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Prêt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content flex-grow-1 p-4">
    <h2><i class="fa-solid fa-eye"></i> Détails Prêt</h2>

    <div class="card">
        <div class="card-body">
            <p><strong>Matériel :</strong> <span th:text="${pret.materiel.nom}">Laptop</span></p>
            <p><strong>Utilisateur :</strong> <span th:text="${pret.utilisateur.nom}">John</span></p>
            <p><strong>Date Début :</strong> <span th:text="${#dates.format(pret.dateDebut,'dd/MM/yyyy')}">01/09/2025</span></p>
            <p><strong>Date Fin :</strong> <span th:text="${#dates.format(pret.dateFin,'dd/MM/yyyy')}">05/09/2025</span></p>
            <p><strong>Statut :</strong>
                <span class="badge"
                      th:classappend="${pret.statut=='En cours'} ? 'bg-info' : (pret.statut=='Terminé' ? 'bg-success' : 'bg-warning')"
                      th:text="${pret.statut}">En cours</span>
            </p>
        </div>
        <div class="card-footer">
            <a th:href="@{/prets}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Retour</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
